# Netlify settings for Elk Leaf Arcade.
# The arcade menu is index.html; each game lives in its own folder (pet/ is Take Care of Your Pet, elven-hunter/ is Elven Hunter, cluck-patrol/ is Cluck Patrol, acorn-run/ is Acorn Run, build-a-house/ is Build a House).
# Everything is static, so there is no build step.
[build]
  publish = "."
  command = ""

# Always fetch the newest version of the menu and game pages.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/pet/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/elven-hunter/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/cluck-patrol/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/acorn-run/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/build-a-house/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
