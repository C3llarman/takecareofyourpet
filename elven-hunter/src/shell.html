<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Elven Hunter 3D</title>
<style>
:root{--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);--ink:#f3e7c9;--gold:#e8c26a;--edge:#6b5424;--green:#7fbf5a;--red:#d6584a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#0a0d09;overflow:hidden;touch-action:none;
  font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;color:var(--ink);
  -webkit-user-select:none;user-select:none}
#wrap{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
#ui{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;
  padding:16px 16px 48px;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;
  background:rgba(5,8,6,.9);-webkit-overflow-scrolling:touch}
#ui.on{display:flex}
.card{width:100%;max-width:520px;margin:0 auto;background:linear-gradient(#241c0e,#141006);
  border:2px solid var(--edge);border-radius:14px;padding:18px 16px 20px;
  box-shadow:0 18px 44px rgba(0,0,0,.6)}
h1{margin:0 0 8px;font-size:25px;color:var(--gold);text-align:center;font-weight:600;letter-spacing:.5px}
h3{margin:14px 0 5px;font-size:13px;color:#c0aa78;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.sub{margin:6px 0;font-size:14.5px;line-height:1.5;color:#ddd0ad;text-align:center}
.hint{font-size:12.5px;color:#9b8b66;margin-top:14px;text-align:center;line-height:1.6}
.btn{display:block;width:100%;margin-top:10px;padding:13px 14px;font:inherit;font-size:16px;
  color:#22190a;background:linear-gradient(#f0d089,#c99a3f);border:1px solid #8a6a24;
  border-radius:10px;cursor:pointer}
a.btn{text-align:center;text-decoration:none}
.btn.alt{background:linear-gradient(#352c15,#211a0b);color:var(--ink);border-color:var(--edge)}
.btn:active{transform:translateY(1px)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:7px}
.pick{background:#120d05;border:2px solid #3b2f16;border-radius:10px;padding:9px;cursor:pointer}
.pick.on{border-color:var(--gold);background:#241a08}
.pick b{display:block;font-size:14px;color:var(--gold);font-weight:600;margin-bottom:2px}
.pick small{font-size:11.5px;color:#a89873;line-height:1.4}
.stat{display:flex;justify-content:space-between;font-size:14px;color:#cdbb8c;
  border-bottom:1px dotted #3d3218;padding:6px 1px}
.skills{display:grid;gap:6px;margin:10px 0}
.sk{background:#120d05;border:1px solid #3b2f16;border-radius:10px;padding:8px 10px;cursor:pointer}
.sk.has{border-color:#6b5424}.sk.off{opacity:.5}
.skh{display:flex;justify-content:space-between;align-items:baseline}
.skh b{font-size:13.5px;color:var(--gold);font-weight:600}
.skh span{font-size:12px;color:#ffe08a}
.sk small{font-size:11.5px;color:#a89873;line-height:1.4}
.sk.can{border-color:#9ff07a;box-shadow:0 0 0 1px rgba(159,240,122,.25) inset}
.sk.can:active{background:#1d2a12}
.sk em{display:block;font-style:normal;font-size:11px;color:#9ff07a;margin-top:3px}
.sk.flash{animation:skf .6s ease-out}
@keyframes skf{0%{background:#3d5a1e}100%{background:#120d05}}
.pts{color:#9ff07a}
.say{margin:10px 2px 12px;font-size:15px;line-height:1.5;color:#f3e7c9;font-style:italic;text-align:center}
.opts{display:grid;gap:7px;margin:12px 0 4px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:#1a1308;
  border:1px solid #6b5424;border-radius:10px;padding:10px 12px;cursor:pointer}
.opt b{display:block;font-size:15px;color:var(--gold);font-weight:600}
.opt small{display:block;font-size:12px;color:#a89873;margin-top:2px}
.opt.gold{border-color:#ffd76a;background:#2a1f08}
.opt.off{opacity:.45;cursor:default}
.opt.slot,.opt.bag{cursor:default}
.opt.bag{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.opt.bag b,.opt.bag small{flex-basis:100%}
.bagbtns{display:flex;gap:6px;margin-top:4px}
.mini{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:8px;border:1px solid #8a6a24;background:linear-gradient(#f0d089,#c99a3f);color:#22190a;cursor:pointer}
.mini.alt{background:#211a0b;color:var(--ink);border-color:var(--edge)}
.lore{display:grid;gap:7px;margin:6px 0 4px}
.lp{background:#120d05;border:1px solid #4a3a1c;border-radius:10px;padding:9px 11px}
.lp b{display:block;font-size:14.5px;color:var(--gold);font-weight:600;margin-bottom:3px}
.lp p{margin:0;font-size:13px;line-height:1.55;color:#d8c9a2}
.lp.off{opacity:.55;border-style:dashed}.lp.off b{color:#8a7a5a;font-style:italic}.lp.off p{color:#8a7a5a;font-style:italic}
.opt:not(.off):active{transform:translateY(1px);background:#2a1f0c}
#ui.see{background:radial-gradient(ellipse at center,rgba(5,8,6,.25),rgba(5,8,6,.7))}
#ui.see .card{margin:auto;background:linear-gradient(rgba(36,28,14,.92),rgba(20,16,6,.92))}
/* the intro film */
#cine{position:absolute;inset:0;display:none;pointer-events:auto;cursor:pointer;overflow:hidden}
#cine.on{display:block}
#cine .cv{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
#cine .cb{position:absolute;left:0;right:0;height:11vh;background:#000;transition:transform 1.2s ease}
#cine .cb.top{top:0}#cine .cb.bot{bottom:0}
#cine.gate .cb.top{transform:translateY(-100%)}#cine.gate .cb.bot{transform:translateY(100%)}
#cine .cblack{position:absolute;inset:0;background:#000;opacity:1}
#cine .cline{position:absolute;left:6%;right:6%;bottom:calc(11vh + 4vh);text-align:center;
  font-size:clamp(19px,3.1vw,34px);line-height:1.45;font-style:italic;letter-spacing:.6px;color:#f6e7bf;
  text-shadow:0 2px 14px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.8);opacity:0;transform:translateY(8px);
  transition:opacity 1.3s ease,transform 2.4s ease}
#cine .cline.on{opacity:1;transform:none}
#cine .ctitle{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:clamp(44px,8.5vw,104px);
  font-weight:600;letter-spacing:4px;color:#f0cf7c;text-shadow:0 4px 30px rgba(0,0,0,.85),0 0 40px rgba(232,194,106,.35);
  opacity:0;transform:scale(.96);transition:opacity 1.6s ease,transform 5s ease}
#cine .ctitle.on{opacity:1;transform:none}
#cine .cgate{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#cine.gate .cgate{display:flex}
#cine.gate .cline,#cine.gate .ctitle,#cine.gate .cskip{display:none}
#cine .cgate b{font-size:clamp(40px,7vw,84px);font-weight:600;letter-spacing:4px;color:#f0cf7c;text-shadow:0 4px 30px rgba(0,0,0,.85)}
#cine .cgate span{font-size:17px;letter-spacing:2px;color:#e8dcbc;text-transform:uppercase;animation:cpulse 2.2s ease-in-out infinite}
@keyframes cpulse{0%,100%{opacity:.35}50%{opacity:1}}
#cine .cskip{position:absolute;right:18px;bottom:calc(5.5vh - 9px + var(--sab));font-size:14px;letter-spacing:1.5px;color:#a89873;
  opacity:0;transition:opacity 1s}
#cine .cskip.on{opacity:.8}
#boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#0a0d09;color:var(--gold);font-size:15px;letter-spacing:.5px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div id="ui"></div>
  <div id="boot">growing the wood…</div>
</div>
