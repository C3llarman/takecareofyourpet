<title>Cluck Patrol</title>
<meta name="description" content="Cluck Patrol: hop across a tropical island and stomp the raccoons and foxes.">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  html,body{height:100%;overflow:hidden;background:#0f2f3d;overscroll-behavior:none;
    touch-action:none;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;}
  .ctl{position:fixed;z-index:5;display:flex;align-items:center;justify-content:center;
    border-radius:50%;border:3px solid #fdf6e3;background:rgba(58,36,24,.5);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    color:#fdf6e3;font-size:34px;line-height:1;touch-action:none;
    width:84px;height:84px;box-shadow:0 4px 0 rgba(58,36,24,.35);
    transition:transform .06s,background .06s;}
  .ctl:active,.ctl.on{background:#4a9e33;transform:translateY(3px) scale(.96);box-shadow:none;}
  .ctl:focus-visible{outline:3px solid #fff;outline-offset:3px}
  #bL{left:calc(18px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));}
  #bR{left:calc(116px + env(safe-area-inset-left));bottom:calc(26px + env(safe-area-inset-bottom));}
  #bJ{right:calc(18px + env(safe-area-inset-right));bottom:calc(26px + env(safe-area-inset-bottom));
    width:104px;height:104px;font-size:18px;font-weight:700;letter-spacing:.05em;}
  #bF{top:calc(14px + env(safe-area-inset-top));right:calc(14px + env(safe-area-inset-right));
    width:46px;height:46px;font-size:19px;border-width:2px;border-radius:14px;}
  @media (max-width:400px){
    .ctl{width:74px;height:74px;font-size:30px}
    #bR{left:calc(104px + env(safe-area-inset-left))}
    #bJ{width:92px;height:92px;font-size:16px}
  }
  #bM{top:calc(14px + env(safe-area-inset-top));right:calc(70px + env(safe-area-inset-right));
    width:46px;height:46px;font-size:22px;border-width:2px;border-radius:14px;text-decoration:none;}
  @media (hover:hover) and (pointer:fine){ #bL,#bR,#bJ{display:none} }
</style>
</head>

function spr(name,cx,by,h,flip,alpha){
  const s=SP[name]; if(!s) return;
  const w=h*s[2]/s[3];
  ctx.save();
  if(alpha!=null) ctx.globalAlpha=alpha;
  ctx.translate(cx,by); if(flip) ctx.scale(-1,1);
  ctx.drawImage(atlas,s[0],s[1],s[2],s[3],-w/2,-h,w,h);
  ctx.restore();
}
function sprPart(name,fy0,fy1,dx,dy,dw,dh){
  const s=SP[name];
  ctx.drawImage(atlas,s[0],s[1]+s[3]*fy0,s[2],s[3]*(fy1-fy0),dx,dy,dw,dh);
}

function resize(){

  dpr=Math.min(devicePixelRatio||1,2.5);
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
  scale=Math.min(vw/MIN_W,vh/MIN_H);

}

function buildLevel(){
  movers=MOVERS.map(m=>({...m,dir:1,dx:0,h:26,kind:'move'}));
  solids=[];
  for(const [a,b] of SEGS) solids.push({x:a,y:GROUND_Y,w:b-a,h:260,kind:'ground'});
  for(const p of STATIC) solids.push({x:p.x,y:p.y,w:p.w,h:26,kind:'plat'});
  for(const c of CRATES) solids.push({x:c.x-26,y:GROUND_Y-52,w:52,h:52,kind:'crate'});
  solids=solids.concat(movers);
  enemies=ENEMY_DEFS.map(([type,x,gy,lo,hi])=>{
    const h=type==='fox'?36:34, w=type==='fox'?42:40;
    return {type,x,y:gy-h,w,h,vx:(type==='fox'?118:96)*(Math.random()<.5?-1:1),
            lo,hi,ext:gy===GROUND_Y?90:0,alive:true,t:Math.random()*9,chase:0};
  });
}
function reset(){
  buildLevel();
  player.x=60;player.y=GROUND_Y-48;player.vx=0;player.vy=0;
  player.hearts=2;player.inv=0;player.riding=null;
  player.safe={x:60,y:GROUND_Y-48};
  puffs=[];clock=TIME_LIMIT;combo=0;camX=0;state='play';
}

/* ================= input ============ */
function pressJump(){
  if(state!=='play'){ reset(); return; }
  keys.jump=true; jumpBuffer=.12;
}
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){keys.left=true;e.preventDefault();}
  if(e.code==='ArrowRight'){keys.right=true;e.preventDefault();}
  if(e.code==='Space'||e.code==='ArrowUp'){pressJump();e.preventDefault();}
  if(e.code==='KeyR'&&state==='play') reset();
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft') keys.left=false;
  if(e.code==='ArrowRight') keys.right=false;
  if(e.code==='Space'||e.code==='ArrowUp') keys.jump=false;
});
function hold(id,on,off){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();
    try{b.setPointerCapture(e.pointerId);}catch(_){}
    b.classList.add('on'); on();});
  const end=e=>{e.preventDefault(); b.classList.remove('on'); off();};
  b.addEventListener('pointerup',end); b.addEventListener('pointercancel',end);
}
hold('bL',()=>keys.left=true,()=>keys.left=false);
hold('bR',()=>keys.right=true,()=>keys.right=false);
hold('bJ',pressJump,()=>keys.jump=false);

function puff(x,y,c,n=14){
  for(let i=0;i<n;i++) puffs.push({x,y,vx:(Math.random()-.5)*280,
    vy:-Math.random()*300-40,r:3+Math.random()*5,life:1,c});
}

/* ================= update ============ */
function update(dt){
  t+=dt;
  if(shake>0) shake=Math.max(0,shake-dt*3);
  puffs.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=1500*dt;p.life-=dt*.9;});
  puffs=puffs.filter(p=>p.life>0);
  if(state!=='play'){ camY=GROUND_Y+Math.max(70,Math.min(300,VIS_H*.3))-VIS_H; return; }

  clock-=dt;
  if(clock<=0){ clock=0; state='lost'; }
  if(comboT>0){ comboT-=dt; if(comboT<=0) combo=0; }

  // moving platforms
  for(const m of movers){
    const nx=m.x+m.sp*m.dir*dt;
    m.dx=nx-m.x; m.x=nx;
    if(m.x<m.lo){m.x=m.lo;m.dir=1;m.dx=0;}
    if(m.x>m.hi){m.x=m.hi;m.dir=-1;m.dx=0;}
  }
  if(player.riding) player.x+=player.riding.dx;

  const dir=(keys.right?1:0)-(keys.left?1:0);
  if(dir){ player.vx+=dir*ACC*dt; player.face=dir; }
  else{ const f=FRIC*dt; player.vx=Math.abs(player.vx)<=f?0:player.vx-Math.sign(player.vx)*f; }
  player.vx=Math.max(-MOVE,Math.min(MOVE,player.vx));

  jumpBuffer-=dt; coyote-=dt;
  if(jumpBuffer>0&&coyote>0){ player.vy=JUMP_V; player.onGround=false; coyote=0; jumpBuffer=0; player.riding=null; }
  if(!keys.jump&&player.vy<-230) player.vy=-230;
  player.vy=Math.min(1250,player.vy+GRAV*dt);

  player.x+=player.vx*dt;
  for(const s of solids) if(hit(player,s)){
    player.x=player.vx>0?s.x-player.w:s.x+s.w; player.vx=0;
  }
  player.x=Math.max(0,Math.min(LEVEL_W-player.w,player.x));

  player.y+=player.vy*dt;
  const wasAir=!player.onGround;
  player.onGround=false; player.riding=null;
  for(const s of solids) if(hit(player,s)){
    if(player.vy>0){
      player.y=s.y-player.h; player.vy=0; player.onGround=true;
      if(s.kind==='move') player.riding=s;
    } else if(player.vy<0){ player.y=s.y+s.h; player.vy=60; }
  }
  if(player.onGround){
    coyote=.11;
    if(wasAir) puff(player.x+player.w/2,player.y+player.h,'#b9925f',5);
    if(onGroundSpan(player.x+player.w/2)&&player.y+player.h<=GROUND_Y+1)
      player.safe={x:player.x,y:player.y};
  }
  if(player.inv>0) player.inv-=dt;
  player.anim+=dt;

  // fell in the water
  if(player.y>DEEP){
    player.hearts--; shake=.8; buzz([30,50,30]);
    if(player.hearts<=0){ state='lost'; }
    else{ player.x=player.safe.x; player.y=player.safe.y;
          player.vx=0; player.vy=0; player.inv=1.4; combo=0; }
  }

  // enemies
  for(const e of enemies){
    if(!e.alive) continue;
    e.t+=dt;
    const px=player.x+player.w/2, ex=e.x+e.w/2;
    if(e.type==='fox'){
      const near=Math.abs(px-ex)<330 && Math.abs((player.y+player.h)-(e.y+e.h))<70;
      e.chase=near?Math.min(1,e.chase+dt*3):Math.max(0,e.chase-dt*2);
      if(e.chase>.5){
        const want=Math.sign(px-ex)*205;
        e.vx+=(want-e.vx)*Math.min(1,dt*4);
      } else {
        e.vx=Math.sign(e.vx||1)*118;
      }
    }
    e.x+=e.vx*dt;
    const lo=e.chase>.5?e.lo-e.ext:e.lo, hi=e.chase>.5?e.hi+e.ext:e.hi;
    if(e.x<lo){e.x=lo;e.vx=Math.abs(e.vx);}
    if(e.x>hi){e.x=hi;e.vx=-Math.abs(e.vx);}

    if(hit(player,e)){
      if(player.vy>60&&(player.y+player.h)-e.y<28){
        e.alive=false;
        puff(ex,e.y+e.h/2,e.type==='fox'?'#e07a2f':'#9aa4ad',20);
        combo++; comboT=1.6; best=Math.max(best,combo);
        player.vy=-540; shake=.5; buzz(18);
      } else if(player.inv<=0){
        player.hearts--; player.inv=1.1; combo=0;
        player.vy=-330; player.vx=player.x<e.x?-280:280;
        shake=.75; buzz([25,45,25]);
        puff(player.x+player.w/2,player.y+14,'#fdf6e3',10);
        if(player.hearts<=0) state='lost';
      }
    }
  }
  if(enemies.every(e=>!e.alive)) state='won';

  const tx=Math.max(0,Math.min(LEVEL_W-VIS_W,player.x+player.w/2-VIS_W/2));
  camX+=(tx-camX)*Math.min(1,dt*6);
  camY=GROUND_Y+Math.max(70,Math.min(300,VIS_H*.3))-VIS_H;
}

/* ================= draw ============ */
function drawBackdrop(L,R,T,B){
  const bh=Math.max(VIS_H+120,640), bw=bh*bgImg.width/bgImg.height;
  const py=GROUND_Y+70-bh, off=camX*.35;
  const i0=Math.floor((L-off)/bw)-1, i1=Math.ceil((R-off)/bw);
  for(let i=i0;i<=i1;i++){
    const x=i*bw+off;
    ctx.save();
    if(((i%2)+2)%2===1){ ctx.translate(x+bw,0); ctx.scale(-1,1); ctx.drawImage(bgImg,0,py,bw,bh); }
    else ctx.drawImage(bgImg,x,py,bw,bh);
    ctx.restore();
  }
  ctx.fillStyle='#cfe9f7'; ctx.fillRect(L,GROUND_Y+68,R-L,B-(GROUND_Y+68));
}
function drawWater(L,R,B){
  for(const [a,b] of PITS){
    if(b<L-40||a>R+40) continue;
    const g=ctx.createLinearGradient(0,GROUND_Y,0,GROUND_Y+220);
    g.addColorStop(0,'#59cbe8'); g.addColorStop(1,'#166f96');
    ctx.fillStyle=g; ctx.fillRect(a,GROUND_Y+4,b-a,B-GROUND_Y);
    ctx.strokeStyle='rgba(255,255,255,.75)'; ctx.lineWidth=3.5; ctx.lineCap='round';
    for(let x=a+8;x<b-8;x+=34){
      const o=Math.sin(t*2.4+x*.05)*4;
      ctx.beginPath(); ctx.moveTo(x,GROUND_Y+22+o);
      ctx.quadraticCurveTo(x+8,GROUND_Y+15+o,x+18,GROUND_Y+22+o); ctx.stroke();
    }
  }
}
function drawGround(L,R,B){
  const T=64;
  for(const [a,b] of SEGS){
    if(b<L-80||a>R+80) continue;
    const x0=a+Math.max(0,Math.floor((L-a)/T))*T, x1=Math.min(b,R+T);
    ctx.save();
    ctx.beginPath(); ctx.rect(a,GROUND_Y-4,b-a,B-GROUND_Y+8); ctx.clip();
    for(let y=GROUND_Y+46;y<B;y+=36)
      for(let x=x0;x<x1;x+=T) sprPart('grass_big',.56,1,x,y,T,38);
    for(let x=x0;x<x1;x+=T) spr('grass_big',x+T/2,GROUND_Y+47,47);
    ctx.restore();
  }
}
function drawPlat(p){
  const T=56;
  ctx.save();
  ctx.beginPath(); ctx.rect(p.x,p.y-6,p.w,54); ctx.clip();
  for(let x=p.x;x<p.x+p.w;x+=T) spr('grass_small',x+T/2,p.y+34,34);
  ctx.restore();
}
function frameFor(){
  if(!player.onGround) return player.vy<-60?'jump':'land';
  if(Math.abs(player.vx)>25) return (Math.floor(player.anim*9)%2)?'run':'idle';
  return 'idle';
}
function draw(){
  const sc=scale*dpr;
  const sx=shake>0?(Math.random()-.5)*shake*10:0, sy=shake>0?(Math.random()-.5)*shake*10:0;
  ctx.setTransform(sc,0,0,sc,(-camX+sx)*sc,(-camY+sy)*sc);
  const L=camX-70,R=camX+VIS_W+70,T=camY-70,B=camY+VIS_H+70;

  drawBackdrop(L,R,T,B);
  for(const p of FARPALMS){ const x=p.x+camX*.55;
    if(x<L-120||x>R+120) continue; spr('palm',x,GROUND_Y+10,p.h,false,.75); }
  drawWater(L,R,B);
  for(const p of PALMS){ if(p.x<L-160||p.x>R+160) continue; spr('palm',p.x,GROUND_Y+8,p.h*1.5); }
  for(const d of DECOR){
    if(d.x<L-90||d.x>R+90) continue;
    const h={bush:42,rock:46,barrel:54,fence:48}[d.t];
    spr(d.t,d.x,GROUND_Y+2,h);
  }

  drawGround(L,R,B);
  for(const s of solids){
    if(s.x>R+90||s.x+s.w<L-90) continue;
    if(s.kind==='plat'||s.kind==='move') drawPlat(s);
    else if(s.kind==='crate') spr('crate',s.x+26,s.y+52,52);
  }

  for(const e of enemies){
    if(!e.alive||e.x<L-140||e.x>R+140) continue;
    ctx.fillStyle='rgba(40,30,20,.18)';
    ctx.beginPath(); ctx.ellipse(e.x+e.w/2,e.y+e.h+2,e.w*.52,5,0,0,7); ctx.fill();
    const flip=e.vx<0;
    if(e.type==='fox') spr(e.chase>.5?'fox_b':(Math.floor(e.t*6)%2?'fox_b':'fox_a'),
                           e.x+e.w/2,e.y+e.h+4,e.chase>.5?34:42,flip);
    else spr(Math.floor(e.t*5)%2?'raccoon_a':'raccoon_b',e.x+e.w/2,e.y+e.h+4,40,flip);
  }

  ctx.fillStyle='rgba(40,30,20,.2)';
  ctx.beginPath(); ctx.ellipse(player.x+player.w/2,player.y+player.h+2,17,5,0,0,7); ctx.fill();
  const blink=player.inv>0&&Math.floor(t*18)%2===0;
  spr(frameFor(),player.x+player.w/2,player.y+player.h+4,60,player.face<0,blink?.35:1);

  for(const p of puffs){
    ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  }
  ctx.globalAlpha=1;
  hud();
}

function pill(x,y,w,h){
  ctx.fillStyle='rgba(40,28,18,.55)';
  ctx.beginPath(); ctx.roundRect(x,y,w,h,13); ctx.fill();
  ctx.strokeStyle='rgba(253,246,227,.45)'; ctx.lineWidth=2; ctx.stroke();
}
function hud(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.textBaseline='middle';
  if(state==='title'){
    ctx.fillStyle='rgba(12,40,52,.72)'; ctx.fillRect(0,0,vw,vh);
    const hh=Math.min(vh*.36,260);
    const s=SP.hero, w=hh*s[2]/s[3];
    ctx.drawImage(atlas,s[0],s[1],s[2],s[3],vw/2-w/2,vh*.16,w,hh);
    ctx.textAlign='center'; ctx.fillStyle='#fdf6e3';
    ctx.font=`700 ${Math.min(54,vw*.11)}px "Trebuchet MS",sans-serif`;
    ctx.fillText('CLUCK PATROL',vw/2,vh*.16+hh+40);
    ctx.font=`400 ${Math.min(18,vw*.042)}px "Trebuchet MS",sans-serif`;
    ctx.fillStyle='rgba(253,246,227,.85)';
    ctx.fillText('Clear all 22 raccoons and foxes. 2 lives, 2:30 on the clock.',vw/2,vh*.16+hh+76);
    ctx.fillText('Foxes charge when they see you. Mind the water.',vw/2,vh*.16+hh+102);
    ctx.font=`700 ${Math.min(20,vw*.05)}px "Trebuchet MS",sans-serif`;
    ctx.fillStyle='#7bd45c';
    ctx.fillText('TAP OR PRESS SPACE TO START',vw/2,vh*.16+hh+146);
    return;
  }
  const y=Math.max(14,vh*.025), x=14;
  pill(x,y,196,46);
  for(let i=0;i<2;i++){
    ctx.fillStyle=i<player.hearts?'#e85a5a':'rgba(253,246,227,.2)';
    const hx=x+24+i*27,hy=y+24;
    ctx.beginPath(); ctx.moveTo(hx,hy+7);
    ctx.bezierCurveTo(hx-11,hy-2,hx-6,hy-13,hx,hy-6);
    ctx.bezierCurveTo(hx+6,hy-13,hx+11,hy-2,hx,hy+7); ctx.fill();
  }
  const left=enemies.filter(e=>e.alive).length;
  ctx.textAlign='left'; ctx.fillStyle='#fdf6e3';
  ctx.font='700 18px "Trebuchet MS",sans-serif';
  ctx.fillText(`${left} left`,x+78,y+24);

  const m=Math.floor(clock/60), s2=Math.floor(clock%60);
  pill(x+206,y,104,46);
  ctx.fillStyle=clock<30?'#ff8a6b':'#fdf6e3';
  ctx.font='700 21px "Trebuchet MS",sans-serif'; ctx.textAlign='center';
  ctx.fillText(`${m}:${String(s2).padStart(2,'0')}`,x+258,y+24);

  if(combo>1){
    ctx.textAlign='center'; ctx.fillStyle='#ffd85c';
    ctx.font='700 26px "Trebuchet MS",sans-serif';
    ctx.fillText(`${combo}x chain!`,vw/2,y+30);
  }
  if(state==='play') return;

  ctx.fillStyle='rgba(12,40,52,.86)'; ctx.fillRect(0,0,vw,vh);
  const won=state==='won';
  const hh=Math.min(vh*.26,190), sp=SP.hero, w=hh*sp[2]/sp[3];
  ctx.save(); if(!won) ctx.globalAlpha=.5;
  ctx.drawImage(atlas,sp[0],sp[1],sp[2],sp[3],vw/2-w/2,vh*.16,w,hh); ctx.restore();
  ctx.textAlign='center'; ctx.fillStyle='#fdf6e3';
  ctx.font=`700 ${Math.min(46,vw*.1)}px "Trebuchet MS",sans-serif`;
  ctx.fillText(won?'ISLAND CLEARED':(clock<=0?"TIME'S UP":'THE FLOCK IS DOWN'),vw/2,vh*.16+hh+44);
  ctx.font=`400 ${Math.min(19,vw*.045)}px "Trebuchet MS",sans-serif`;
  ctx.fillStyle='rgba(253,246,227,.85)';
  const cleared=enemies.filter(e=>!e.alive).length;
  ctx.fillText(won?`${Math.floor(clock)}s to spare · best chain ${best}x`
                 :`${cleared} of ${enemies.length} cleared · best chain ${best}x`,vw/2,vh*.16+hh+80);
  ctx.font=`700 ${Math.min(18,vw*.042)}px "Trebuchet MS",sans-serif`;
  ctx.fillStyle='#7bd45c';
  ctx.fillText('Tap anywhere to try again',vw/2,vh*.16+hh+124);
}

/* ================= loop ============ */
buildLevel();
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000); last=now;
  if(ready<need){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#0f2f3d'; ctx.fillRect(0,0,vw,vh);
    ctx.fillStyle='#fdf6e3'; ctx.textAlign='center'; ctx.font='600 19px "Trebuchet MS",sans-serif';
    ctx.fillText('Loading the island…',vw/2,vh/2);
  } else { update(dt); draw(); }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{ last=performance.now(); });
requestAnimationFrame(loop);
</script>
