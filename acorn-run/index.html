<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#62B9EC">
<title>Acorn Run</title>
<meta name="description" content="Acorn Run: pick a squirrel and race across floating islands, glide on leaves, collect acorns and dodge the grumpy skunks.">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#62B9EC;
    touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  /* Zero-size probes: the game reads their height to keep the HUD clear of
     notches and home indicators. Do not remove. */
  #safe{position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);pointer-events:none;visibility:hidden}
  #safeb{position:fixed;bottom:0;left:0;width:1px;height:env(safe-area-inset-bottom,0px);pointer-events:none;visibility:hidden}
  /* Elk Leaf Arcade badge, back to the arcade menu: top left on the menus, top centre during a run
     so it clears the acorn count and distance (game.js sets body.running) */
  #home{position:fixed;z-index:2;top:calc(env(safe-area-inset-top,0px) + 8px);left:calc(env(safe-area-inset-left,0px) + 10px);
    width:54px;height:54px;display:block;border-radius:50%;text-decoration:none}
  #home img{display:block;width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(59,36,18,.45));transition:transform .15s}
  #home:hover img{transform:rotate(-8deg) scale(1.06)}
  #home:active img{transform:scale(.92)}
  body.running #home{top:calc(env(safe-area-inset-top,0px) + 6px);left:50%;transform:translateX(-50%)}
  #home:focus-visible{outline:3px solid #FFD85A;outline-offset:3px}
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Acorn Run. Tap or press space to jump."></canvas>
<div id="safe"></div>
<div id="safeb"></div>
<a id="home" href="../" aria-label="Back to Elk Leaf Arcade" title="Back to Elk Leaf Arcade"><img src="../badge.webp" width="54" height="54" alt=""></a>
<script src="src/atlas.js"></script>
<script src="src/game.js"></script>
<!-- Elk Leaf Arcade turn timer (see ../turns.js); data-pos keeps its bubble clear of this game's buttons -->
<script src="../turns.js" data-game data-pos="top-right" data-offset="48" defer></script>
</body>
</html>
